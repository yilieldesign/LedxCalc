name: Deploy Web (Wasm)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build Wasm web app
        run: chmod +x gradlew && ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon --stacktrace

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: webApp/build/dist/wasmJs/productionExecutable
          retention-days: 2

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: webApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy prebuilt dist to Vercel
        id: vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_JbbzFyQe1A3Sn0TbsRsKtEPs
          VERCEL_PROJECT_ID: prj_3lckjztSjmXJl8nPJsw1vqMdJlta
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Falta el secret VERCEL_TOKEN en GitHub → Settings → Secrets → Actions."
            echo "Crea un token en https://vercel.com/account/tokens y guárdalo como VERCEL_TOKEN."
            exit 1
          fi
          cp -r .vercel dist/.vercel
          cd dist
          echo "Subiendo dist precompilado a Vercel (sin rebuild)..."
          if ! npx vercel@41 deploy . --prod --yes --token "$VERCEL_TOKEN"; then
            echo "::error::Deploy a Vercel falló. Suele ser VERCEL_TOKEN vencido o sin acceso al proyecto ledx-calc."
            echo "1) https://vercel.com/account/tokens → Create → Full Account"
            echo "2) GitHub → Settings → Secrets and variables → Actions → VERCEL_TOKEN → Update"
            echo "3) Actions → Deploy Web (Wasm) → Run workflow"
            echo "GitHub Pages igual quedó publicado aunque Vercel falle."
            exit 1
          fi
          echo "Deploy Vercel OK"

      - name: Vercel deploy status
        if: always()
        run: |
          if [ "${{ steps.vercel.outcome }}" = "success" ]; then
            echo "Vercel: OK → https://ledx-calc.vercel.app"
          else
            echo "Vercel: FALLÓ (revisa VERCEL_TOKEN). La app en GitHub Pages sí está actualizada:"
            echo "https://yilieldesign.github.io/LedxCalc/"
          fi
